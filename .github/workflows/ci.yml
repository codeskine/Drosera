name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version to package, such as 0.1.0. Left empty, nothing is packaged.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PLUGINVAL_VERSION: v1.0.4
      VST3: build/Drosera_artefacts/Release/VST3/Drosera.vst3
      # Any signing secret means signing is wanted: build_pkg.sh then fails unless all are there.
      CAN_NOTARIZE: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_CERTIFICATE_PASSWORD != '' || secrets.APPLE_ID != '' || secrets.APPLE_TEAM_ID != '' || secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: .deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR:PATH=.deps
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --target voice_allocator_test render_test render_cli ui_test plugin_host_test Drosera_VST3 Drosera_AU Drosera_Standalone

      - name: Test the release check
        run: python3 tools/test_release_check.py

      - name: voice_allocator_test
        run: build/voice_allocator_test

      - name: render_test
        run: build/render_test

      - name: ui_test
        run: build/ui_test_artefacts/Release/ui_test

      - name: plugin_host_test
        run: build/plugin_host_test_artefacts/Release/plugin_host_test "$VST3" tests/fixtures/state-baseline.bin

      - name: pluginval
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval-bin
          pluginval-bin/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate "$VST3"

      # Audio Units are found only in the plugin folders, so install the built one for the runner's user.
      - name: auval and pluginval on the AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto build/Drosera_artefacts/Release/AU/Drosera.component ~/Library/Audio/Plug-Ins/Components/Drosera.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Dros Cdsk
          pluginval-bin/pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/Drosera.component

      - name: Check reference renders
        run: tools/hardware-comparison/check_reference.sh build/render_cli

      - name: Test the package scripts
        run: tools/package/test_package.sh build/Drosera_artefacts/Release

      - name: Build and check the installer
        env:  # only this step sees them, not brew, pluginval or the tests
          VERSION: ${{ inputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          version="$VERSION"
          [ -n "$version" ] || version=$(sed -nE 's/^project\(Drosera VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)

          # Sign only a versioned build, and only when the secrets exist. build_pkg.sh signs when all five
          # variables are set, so the others are cleared for every other build.
          if [ -n "$VERSION" ] && [ "$CAN_NOTARIZE" = true ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            password=$(uuidgen)
            security create-keychain -p "$password" "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security list-keychains -d user -s "$keychain"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
            identities=$(security find-identity -v -p basic "$keychain")
            DEVELOPER_ID_APPLICATION=$(sed -nE 's/.*"(Developer ID Application: [^"]*)".*/\1/p' <<< "$identities" | head -1)
            DEVELOPER_ID_INSTALLER=$(sed -nE 's/.*"(Developer ID Installer: [^"]*)".*/\1/p' <<< "$identities" | head -1)
            export DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER
            export REQUIRE_SIGNED=1
          else
            unset APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD
          fi

          tools/package/build_pkg.sh build/Drosera_artefacts/Release "$version" "Drosera-$version-macos.pkg"
          tools/package/check_pkg.sh "Drosera-$version-macos.pkg"

      - name: Upload the package
        if: inputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: drosera-macos
          path: Drosera-${{ inputs.version }}-macos.pkg
          if-no-files-found: error
