name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      version:
        description: Version to package, such as 0.1.0. Left empty, nothing is packaged.
        type: string
        default: ""

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  VST3: build/Drosera_artefacts/Release/VST3/Drosera.vst3

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: .deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR:PATH=.deps
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          CC: cl
          CXX: cl
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR:PATH=.deps

      - name: Build
        run: cmake --build build --target render_test render_cli plugin_host_test Drosera_VST3

      - name: render_test
        run: build/render_test

      - name: plugin_host_test
        run: build/plugin_host_test_artefacts/Release/plugin_host_test "$VST3" tests/fixtures/state-baseline.bin

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_macOS.zip"
          unzip -q pluginval.zip -d pluginval-bin
          echo "PLUGINVAL=pluginval-bin/pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          unzip -q pluginval.zip -d pluginval-bin
          echo "PLUGINVAL=pluginval-bin/pluginval.exe" >> "$GITHUB_ENV"

      - name: pluginval
        run: '"$PLUGINVAL" --strictness-level 5 --validate-in-process --validate "$VST3"'

      - name: Check reference renders (macOS arm64 only)
        if: runner.os == 'macOS'
        run: tools/hardware-comparison/check_reference.sh build/render_cli

      - name: Check the MSVC runtime is linked statically
        if: runner.os == 'Windows'
        run: |
          dumpbin -nologo -dependents "$VST3/Contents/x86_64-win/Drosera.vst3" | tee deps.txt
          if grep -iE "vcruntime|msvcp" deps.txt; then exit 1; fi
